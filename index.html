<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cyber Silicon Valley - Atelier Keynote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#101418;
    --carbon:#151a20;
    --surface:#1c232a;
    --surface-2:#222a33;
    --ink:#f3f7f8;
    --body:#ccd5d7;
    --muted:#8d9aa0;
    --hair:#3a454c;
    --gold:#b99a58;
    --gold-soft:#d6c18d;
    --red:#b92c24;
    --blue:#2b8ac5;
    --cyan:#74c7e8;
    --pad-x:clamp(40px,6vw,104px);
    --pad-y:clamp(26px,5vh,64px);
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--black);color:var(--ink);overflow:hidden}
  body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .deck{
    position:relative;
    width:100vw;
    height:100vh;
    background:
      radial-gradient(90% 86% at 78% 18%, rgba(116,199,232,.18), transparent 48%),
      radial-gradient(72% 58% at 4% 92%, rgba(43,138,197,.13), transparent 54%),
      linear-gradient(90deg, rgba(16,20,24,.95) 0%, rgba(16,20,24,.82) 48%, rgba(16,20,24,.55) 100%),
      repeating-linear-gradient(90deg, rgba(116,199,232,.05) 0 1px, transparent 1px 136px),
      var(--black);
    isolation:isolate;
  }

  .deck::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      linear-gradient(180deg, rgba(255,255,255,.08), transparent 13%, transparent 84%, rgba(255,255,255,.05)),
      repeating-linear-gradient(0deg, rgba(116,199,232,.035) 0 1px, transparent 1px 52px),
      repeating-linear-gradient(90deg, rgba(116,199,232,.026) 0 1px, transparent 1px 52px),
      repeating-linear-gradient(135deg, rgba(255,255,255,.014) 0 1px, transparent 1px 22px);
    mix-blend-mode:screen;
    opacity:.36;
  }

  .deck::after{
    content:"";
    position:absolute;
    inset:18px;
    border:1px solid rgba(116,199,232,.16);
    z-index:7;
    pointer-events:none;
  }

  .slide{
    position:absolute;
    inset:0;
    opacity:0;
    pointer-events:none;
    transform:scale(1.014);
    filter:blur(7px);
    transition:opacity .85s cubic-bezier(.16,1,.3,1),transform 1.1s cubic-bezier(.16,1,.3,1),filter .75s ease;
    will-change:opacity,transform,filter;
  }

  .slide.active{opacity:1;pointer-events:auto;transform:none;filter:none;transition-delay:.04s}

  .hero-media{
    position:absolute;
    inset:0 0 0 auto;
    width:58vw;
    overflow:hidden;
    z-index:0;
  }

  .hero-media .image{
    position:absolute;
    inset:-3%;
    background-size:cover;
    background-position:center;
    filter:grayscale(.55) brightness(.5) contrast(1.14) saturate(.66);
    opacity:.58;
    transform:scale(1.05);
    transition:opacity .9s ease;
  }
  .slide.active .hero-media .image{
    opacity:.66;
    animation:kenburns 20s ease-out both;
  }
  @keyframes kenburns{from{transform:scale(1.05)}to{transform:scale(1.13)}}

  /* vivid real-photo slides (DCBBS / server racks) — full colour, stronger scrim so text stays clean */
  .slide.vivid .hero-media .image{
    filter:grayscale(.08) brightness(.82) contrast(1.05) saturate(1.1);
    opacity:.92;
  }
  .slide.vivid .hero-media::before{
    background:
      linear-gradient(90deg, #101418 0%, rgba(16,20,24,.93) 28%, rgba(16,20,24,.52) 62%, rgba(16,20,24,.18) 100%),
      linear-gradient(180deg, rgba(16,20,24,.22), transparent 46%, rgba(16,20,24,.52));
  }

  .hero-media::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:2;
    background:
      linear-gradient(90deg, #101418 0%, rgba(16,20,24,.88) 22%, rgba(16,20,24,.48) 58%, rgba(16,20,24,.2) 100%),
      linear-gradient(180deg, rgba(16,20,24,.24), transparent 44%, rgba(16,20,24,.58));
  }

  .hero-media::after{
    content:"";
    position:absolute;
    right:11vw;
    top:50%;
    width:min(42vw,620px);
    aspect-ratio:1;
    transform:translateY(-50%);
    border:1px solid rgba(116,199,232,.11);
    border-radius:50%;
    background:
      repeating-conic-gradient(from -12deg, rgba(116,199,232,.12) 0deg 1deg, transparent 1deg 14deg),
      radial-gradient(circle, transparent 0 56%, rgba(116,199,232,.11) 56% 57%, transparent 57% 100%);
    opacity:.22;
    mix-blend-mode:screen;
  }

  .content{
    position:absolute;
    z-index:4;
    left:var(--pad-x);
    top:var(--pad-y);
    bottom:var(--pad-y);
    width:min(56vw,930px);
    display:grid;
    grid-template-rows:auto 1fr auto;
  }

  .topline{
    display:flex;
    align-items:center;
    gap:18px;
    color:var(--muted);
    font:500 11px/1 JetBrains Mono,monospace;
    letter-spacing:.22em;
    text-transform:uppercase;
  }

  .topline .mark{
    width:74px;
    height:4px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:4px;
  }

  .topline .mark i:nth-child(1){background:rgba(43,138,197,.92)}
  .topline .mark i:nth-child(2){background:rgba(116,199,232,.8)}
  .topline .mark i:nth-child(3){background:rgba(185,154,88,.68)}

  .main{
    align-self:center;
    max-width:980px;
  }

  .kicker{
    margin:0 0 18px;
    color:#b8d8e6;
    font:500 12px/1.2 JetBrains Mono,monospace;
    letter-spacing:.2em;
    text-transform:uppercase;
  }

  h1{
    margin:0;
    max-width:14ch;
    font-family:Inter,system-ui,sans-serif;
    font-size:clamp(38px,min(5.9vw,9.2vh),82px);
    font-weight:800;
    line-height:.96;
    letter-spacing:.01em;
    text-transform:uppercase;
  }

  h1 .accent{color:#b8d8e6}
  .slide[data-tone="red"] h1 .accent{color:#e2b0ac}
  .slide[data-tone="blue"] h1 .accent{color:#a8c8df}

  .lede{
    max-width:62ch;
    margin:22px 0 0;
    color:#d4dcde;
    font-size:clamp(16px,1.2vw,21px);
    line-height:1.52;
    font-weight:300;
  }

  .proof{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:0 clamp(22px,2.7vw,44px);
    margin-top:clamp(26px,3vw,42px);
    max-width:1000px;
  }

  .spec{
    border-top:1px solid rgba(116,199,232,.24);
    padding-top:15px;
    min-height:96px;
  }

  .spec .num{
    display:flex;
    align-items:center;
    gap:10px;
    color:#b8d8e6;
    font:600 12px/1 JetBrains Mono,monospace;
    letter-spacing:.18em;
    text-transform:uppercase;
    margin-bottom:14px;
  }

  .spec .num::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, rgba(116,199,232,.32), transparent);
  }

  .spec p{
    margin:0;
    color:#e3e8e8;
    font-size:clamp(13px,1vw,16px);
    line-height:1.55;
    font-weight:300;
  }

  .footer{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:end;
    gap:28px;
    color:var(--muted);
    font:500 11px/1 JetBrains Mono,monospace;
    letter-spacing:.18em;
    text-transform:uppercase;
  }

  .footer .rule{
    height:1px;
    background:linear-gradient(90deg, rgba(116,199,232,.34), rgba(255,255,255,.1), transparent);
    margin-bottom:5px;
  }

  .footer strong{color:var(--ink);font-weight:500}

  .chapter{
    position:absolute;
    z-index:5;
    right:var(--pad-x);
    top:var(--pad-y);
    display:flex;
    align-items:flex-start;
    gap:18px;
    color:rgba(248,245,238,.84);
    font:500 11px/1 JetBrains Mono,monospace;
    letter-spacing:.22em;
    text-transform:uppercase;
  }

  .chapter .number{
    color:rgba(184,216,230,.84);
    font-family:Inter,system-ui,sans-serif;
    font-size:clamp(38px,4.8vw,74px);
    font-weight:700;
    line-height:.82;
    letter-spacing:0;
  }

  .side-rail{
    position:absolute;
    z-index:6;
    right:22px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:11px;
  }

  .dot{
    width:7px;
    height:7px;
    border:1px solid rgba(116,199,232,.34);
    background:transparent;
    transform:rotate(45deg);
    cursor:pointer;
  }

  .dot.on{background:#b8d8e6}

  .progress{
    position:fixed;
    left:18px;
    right:18px;
    bottom:18px;
    z-index:8;
    height:2px;
    background:rgba(255,255,255,.08);
  }

  .progress i{
    display:block;
    height:100%;
    width:0;
    background:linear-gradient(90deg, rgba(43,138,197,.86), rgba(116,199,232,.92));
    transition:width .72s cubic-bezier(.22,.61,.36,1);
  }

  .controls{
    position:fixed;
    z-index:9;
    right:var(--pad-x);
    bottom:calc(var(--pad-y) - 18px);
    display:flex;
    gap:10px;
  }

  .controls button{
    width:42px;
    height:42px;
    border:1px solid rgba(116,199,232,.28);
    border-radius:0;
    color:var(--ink);
    background:rgba(12,12,12,.68);
    font:600 15px/1 JetBrains Mono,monospace;
    cursor:pointer;
    backdrop-filter:blur(14px);
  }

  .controls button:hover{border-color:var(--cyan);color:var(--cyan)}

  body.exporting .controls,
  body.exporting .side-rail{
    display:none;
  }

  /* ---- techy transition: scan sweep + frame corner ticks ---- */
  .sweep{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden;opacity:0}
  .sweep.run{animation:sweepFade .72s ease}
  .sweep i{position:absolute;top:0;bottom:0;left:-6%;width:2px;
    background:linear-gradient(180deg,transparent,var(--cyan) 18%,#eaf7ff 50%,var(--cyan) 82%,transparent);
    box-shadow:0 0 30px 6px rgba(116,199,232,.5)}
  .sweep i::before{content:"";position:absolute;top:0;bottom:0;right:2px;width:280px;
    background:linear-gradient(90deg,transparent,rgba(116,199,232,.09))}
  .sweep.run i{animation:sweepMove .72s cubic-bezier(.55,0,.25,1)}
  .sweep.run.rev i{animation:sweepMoveRev .72s cubic-bezier(.55,0,.25,1)}
  .sweep.run.rev i::before{right:auto;left:2px;background:linear-gradient(270deg,transparent,rgba(116,199,232,.09))}
  @keyframes sweepMove{from{left:-6%}to{left:106%}}
  @keyframes sweepMoveRev{from{left:106%}to{left:-6%}}
  @keyframes sweepFade{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

  .corners{position:fixed;inset:18px;z-index:8;pointer-events:none}
  .corners span{position:absolute;width:13px;height:13px;border:1px solid rgba(116,199,232,.5)}
  .corners span:nth-child(1){top:-1px;left:-1px;border-right:0;border-bottom:0}
  .corners span:nth-child(2){top:-1px;right:-1px;border-left:0;border-bottom:0}
  .corners span:nth-child(3){bottom:-1px;left:-1px;border-right:0;border-top:0}
  .corners span:nth-child(4){bottom:-1px;right:-1px;border-left:0;border-top:0}

  /* faint diagonal ownership watermark — subtle on screen, visible on copies/screenshots, tiles full-frame so it can't be cropped out */
  .watermark{position:fixed;top:-30%;left:-30%;width:160%;height:160%;z-index:7;pointer-events:none;
    opacity:.10;transform:rotate(-30deg);background-repeat:repeat;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="360" height="188"><text x="8" y="100" font-family="monospace" font-size="14" letter-spacing="5" fill="%23ffffff">SUPERMICRO / TUO / SJEC EXPO 2026</text></svg>');}

  .slide.active .reveal{animation:reveal .78s both cubic-bezier(.22,.61,.36,1)}
  .slide.active .reveal:nth-child(1){animation-delay:.04s}
  .slide.active .reveal:nth-child(2){animation-delay:.12s}
  .slide.active .reveal:nth-child(3){animation-delay:.20s}
  .slide.active .spec{animation:reveal .72s both cubic-bezier(.22,.61,.36,1)}
  .slide.active .spec:nth-child(1){animation-delay:.28s}
  .slide.active .spec:nth-child(2){animation-delay:.38s}
  .slide.active .spec:nth-child(3){animation-delay:.48s}

  @keyframes reveal{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:none}
  }

  /* alternate layout: "wall" (problem grid) - same style, different composition */
  .slide.wall .hero-media,.slide.stat .hero-media,.slide.loop .hero-media,.slide.agents .hero-media,.slide.react .hero-media,.slide.stack .hero-media{display:none}
  .slide.wall .content,.slide.stat .content,.slide.loop .content,.slide.agents .content,.slide.react .content,.slide.stack .content{width:auto;right:var(--pad-x)}
  .wallmain{align-self:center}
  .wallhead{margin:0 0 6px;font-family:Inter,system-ui,sans-serif;font-weight:800;text-transform:uppercase;
    line-height:.96;letter-spacing:.01em;font-size:clamp(34px,min(5.4vw,8vh),68px);max-width:20ch}
  .bricks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:24px 0 16px}
  .brick{border:1px solid rgba(116,199,232,.22);background:rgba(116,199,232,.045);
    padding:15px 16px 17px;display:flex;flex-direction:column;gap:7px;min-height:104px}
  .brick .bk{font:600 11px/1 JetBrains Mono,monospace;letter-spacing:.18em;text-transform:uppercase;color:#b8d8e6}
  .brick .bv{font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(17px,1.5vw,24px);color:#f3f7f8;line-height:1.05}
  .brick .bd{font-size:12px;line-height:1.42;color:#9aa0a6;font-weight:300}
  .wallclose{margin:0;font-family:Inter,system-ui,sans-serif;font-weight:300;font-size:clamp(15px,1.3vw,20px);color:#d4dcde;max-width:66ch}
  .slide.active .brick{animation:reveal .7s both cubic-bezier(.22,.61,.36,1)}
  .slide.active .brick:nth-child(1){animation-delay:.16s}
  .slide.active .brick:nth-child(2){animation-delay:.22s}
  .slide.active .brick:nth-child(3){animation-delay:.28s}
  .slide.active .brick:nth-child(4){animation-delay:.34s}
  .slide.active .brick:nth-child(5){animation-delay:.40s}
  .slide.active .brick:nth-child(6){animation-delay:.46s}
  .slide.active .brick:nth-child(7){animation-delay:.52s}

  /* stat layout */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:30px 0 16px}
  .stat{border-left:2px solid rgba(116,199,232,.5);padding:2px 0 2px 18px}
  .stat .sv{font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(34px,4.2vw,62px);line-height:1;color:#f3f7f8}
  .stat .sk{margin-top:10px;font:600 11px/1.3 JetBrains Mono,monospace;letter-spacing:.16em;text-transform:uppercase;color:#b8d8e6}
  .wallsub{margin:8px 0 0;font:500 13px/1.5 JetBrains Mono,monospace;letter-spacing:.03em;color:#9aa0a6}

  /* loop layout */
  .loop{display:flex;align-items:stretch;gap:8px;margin:26px 0 16px;flex-wrap:wrap}
  .loop .step{flex:1 1 0;min-width:165px;border:1px solid rgba(116,199,232,.22);background:rgba(116,199,232,.045);padding:14px 15px 16px;display:flex;flex-direction:column;gap:7px}
  .loop .sn{font:700 12px/1 JetBrains Mono,monospace;color:#b8d8e6;letter-spacing:.1em}
  .loop .sk{font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(15px,1.3vw,21px);text-transform:uppercase;color:#f3f7f8;line-height:1.05}
  .loop .step .bd{font-size:12px;line-height:1.42;color:#9aa0a6;font-weight:300}
  .loop .arrow{display:flex;align-items:center;color:#b8d8e6;font-size:18px;opacity:.6}

  /* agents layout */
  .super{margin:24px 0 12px;border:1px solid rgba(116,199,232,.3);background:rgba(116,199,232,.06);padding:13px 16px;font:600 13px/1.4 JetBrains Mono,monospace;letter-spacing:.05em;text-transform:uppercase;color:#d6eaf2}
  .agentrow{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .agentrow .brick{min-height:78px}

  /* react engineering diagram */
  .react .diagram{display:flex;justify-content:center}
  .react svg{display:block;width:100%;height:auto;max-height:49vh;margin:10px 0 0}
  .rnode{fill:rgba(116,199,232,.06);stroke:rgba(116,199,232,.5);stroke-width:1.3}
  .rnode-l{font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:18px;fill:#f3f7f8;letter-spacing:.04em}
  .rnode-d{font-family:'JetBrains Mono',monospace;font-size:10.5px;fill:#9aa0a6}
  .rlink{fill:none;stroke:rgba(116,199,232,.4);stroke-width:1.3}
  .rflow{fill:none;stroke:#9fe0ff;stroke-width:2.4;stroke-dasharray:2 12;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(116,199,232,.9));animation:flow .7s linear infinite}
  .rfeedback{fill:none;stroke:#e6cf95;stroke-width:2;stroke-dasharray:2 12;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(185,154,88,.7));animation:flow 1.5s linear infinite}
  .rlabel{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:10px;fill:#b8d8e6;letter-spacing:.1em}
  .rlabel.rgold{fill:#d6c18d}
  .rgate{fill:rgba(185,154,88,.12);stroke:rgba(185,154,88,.7);stroke-width:1.3}
  .rgate-l{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;fill:#d6c18d;letter-spacing:.08em}
  .rchip{fill:rgba(116,199,232,.05);stroke:rgba(116,199,232,.32);stroke-width:1}
  .rchip-l{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:9px;fill:#b8d8e6;letter-spacing:.05em}
  @keyframes flow{to{stroke-dashoffset:-28}}

  /* stack (3D layered) diagram */
  .stack svg{display:block;width:100%;height:auto;max-height:53vh;margin:6px 0 0}
  .plate{stroke-width:1.5;filter:drop-shadow(0 7px 12px rgba(0,0,0,.6))}
  .plate-c{fill:rgba(18,26,34,.92);stroke:rgba(116,199,232,.6)}
  .plate-g{fill:rgba(46,37,18,.95);stroke:rgba(185,154,88,.9)}
  .plate-side{stroke-width:1}
  .plate-side-l{fill:rgba(7,12,17,.97);stroke:rgba(116,199,232,.22)}
  .plate-side-r{fill:rgba(12,19,26,.97);stroke:rgba(116,199,232,.32)}
  .pl-l{font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:21px;fill:#f3f7f8;letter-spacing:.05em}
  .pl-l.g{fill:#e6cf95}
  .pl-d{font-family:'JetBrains Mono',monospace;font-size:11px;fill:#9aa0a6}
  .mod{fill:rgba(13,20,27,.96);stroke:rgba(116,199,232,.55);stroke-width:1.4}
  .mod-g{fill:rgba(38,31,16,.96);stroke:rgba(185,154,88,.85)}
  .modroof{fill:rgba(116,199,232,.14);stroke:rgba(116,199,232,.5);stroke-width:1}
  .modlabel{fill:rgba(116,199,232,.1)}
  .mod-l{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12.5px;fill:#dff0f8;letter-spacing:.06em}
  .mod-l.g{fill:#e6cf95}
  .seam{stroke:rgba(116,199,232,.28);stroke-width:1;fill:none}
  .bolt{fill:rgba(116,199,232,.55)}
  .led{fill:#74c7e8;filter:drop-shadow(0 0 4px #74c7e8);animation:pulse 1.4s ease-in-out infinite}
  .ledg{fill:#e6cf95;filter:drop-shadow(0 0 4px #e6cf95);animation:pulse 1.4s ease-in-out infinite}
  .mini{fill:rgba(13,20,27,.95);stroke:rgba(116,199,232,.4);stroke-width:1}
  .mini-l{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:9px;fill:#b8d8e6;letter-spacing:.04em}
  @keyframes pulse{50%{opacity:.3}}

  @media (max-width:900px){
    .deck{overflow:auto}
    body{overflow:auto}
    .slide{min-height:100vh}
    .hero-media{width:100%;opacity:.56}
    .content{left:28px;right:28px;top:34px;bottom:34px;width:auto}
    .chapter{display:none}
    .topline{align-items:flex-start;gap:14px;font-size:10px;letter-spacing:.16em;line-height:1.45}
    .topline span:last-child{max-width:calc(100vw - 150px)}
    h1{font-size:clamp(42px,15vw,76px)}
    .lede{font-size:16px}
    .proof{grid-template-columns:1fr;gap:16px;margin-top:34px}
    .spec{min-height:auto}
    .footer{display:none}
    .side-rail{display:none}
    .controls{right:28px;bottom:30px}
    .deck::after{inset:10px}
  }
</style>
</head>
<body>

function esc(value){
  return String(value).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[c]));
}

}

    const cx0=TX[0]+TW/2,cx4=TX[4]+TW/2;
    const feedback=`<path class="rfeedback" d="M${cx4},134 C ${cx4},48 ${cx0},48 ${cx0},134" marker-end="url(#ahg2)"/><text class="rlabel rgold" x="${(cx0+cx4)/2}" y="40" text-anchor="middle">RE-RUN THE LOOP</text>`;
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="diagram reveal"><svg viewBox="0 0 1130 380" preserveAspectRatio="xMidYMid meet"><defs><marker id="ahg2" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e6cf95"/></marker></defs>${bridges}${feedback}${towers}${agents}</svg></div><p class="wallclose reveal">${esc(slide.floor)}</p></div>`;
  }
  if(slide.layout === "stat"){
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="stats reveal">${slide.stats.map(s=>`<div class="stat"><div class="sv">${esc(s.v)}</div><div class="sk">${esc(s.k)}</div></div>`).join("")}</div><p class="wallclose reveal">${esc(slide.weld)}</p><p class="wallsub reveal">${esc(slide.scale2)}</p></div>`;
  }
  if(slide.layout === "loop"){
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="loop reveal">${slide.loop.map((s,i)=>`<div class="step"><div class="sn">${esc(s.n)}</div><div class="sk">${esc(s.k)}</div><div class="bd">${esc(s.d)}</div></div>${i<slide.loop.length-1?`<div class="arrow">&rarr;</div>`:""}`).join("")}</div><p class="wallclose reveal">${esc(slide.callout)}</p></div>`;
  }
  if(slide.layout === "agents"){
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="super reveal">${esc(slide.supervisor)}</div><div class="bricks agentrow reveal">${slide.agents.map(a=>`<div class="brick"><div class="bk">${esc(a.k)}</div><div class="bd">${esc(a.d)}</div></div>`).join("")}</div><p class="wallclose reveal">${esc(slide.floor)}</p></div>`;
  }
  return `<div class="main"><p class="kicker reveal">${esc(slide.eyebrow)}</p><h1 class="reveal">${titleHtml(slide)}</h1><p class="lede reveal">${esc(slide.lede)}</p><div class="proof">${slide.points.map((point,pointIdx)=>`<div class="spec"><span class="num">${String(pointIdx+1).padStart(2,"0")}</span><p>${esc(point)}</p></div>`).join("")}</div></div>`;
}

function render(){
  deck.innerHTML = slides.map((slide, idx) => `
    <section class="slide ${idx === 0 ? "active" : ""} ${slide.photo ? "vivid" : ""}${slide.layout ? " " + esc(slide.layout) : ""}" data-tone="${esc(slide.tone)}">
      <div class="hero-media"><div class="image" style="background-image:url('${esc(slide.photo || slide.image)}')"></div></div>
      <div class="chapter"><span>${esc(slide.eyebrow.split("/")[0].trim())}</span><span class="number">${String(idx + 1).padStart(2,"0")}</span></div>
      <div class="content">
        <div class="topline reveal"><span class="mark"><i></i><i></i><i></i></span><span>${esc(slide.tagline)}</span></div>
        ${mainBlock(slide)}
        <div class="footer">
          <div><div class="rule"></div><span>Supermicro / SJEC Expo / Cyber Silicon Valley</span></div>
          <span><strong>${String(idx + 1).padStart(2,"0")}</strong> / ${String(slides.length).padStart(2,"0")}</span>
        </div>
      </div>
    </section>
  `).join("");

  rail.innerHTML = slides.map((_, idx) => `<button class="dot ${idx === 0 ? "on" : ""}" data-slide="${idx}" title="Slide ${idx + 1}" aria-label="Go to slide ${idx + 1}"></button>`).join("");
  rail.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => go(Number(btn.dataset.slide))));
  const params = new URLSearchParams(location.search);
  const requested = Number(params.get("slide") || "1");
  if(params.get("export") === "1"){
    document.body.classList.add("exporting");
  }
  go(Number.isFinite(requested) ? requested - 1 : 0);
}

const sweep = document.getElementById("sweep");
function runSweep(dir){
  if(!sweep) return;
  sweep.classList.remove("run","rev");
  void sweep.offsetWidth;            // restart the animation
  sweep.classList.add("run");
  if(dir < 0) sweep.classList.add("rev");
}

function go(next){
  const target = Math.max(0, Math.min(slides.length - 1, next));
  if(target !== active) runSweep(target > active ? 1 : -1);
  active = target;
  document.querySelectorAll(".slide").forEach((slide, idx) => slide.classList.toggle("active", idx === active));
  document.querySelectorAll(".dot").forEach((dot, idx) => dot.classList.toggle("on", idx === active));
  progress.style.width = `${((active + 1) / slides.length) * 100}%`;
}

document.getElementById("prev").addEventListener("click", () => go(active - 1));
document.getElementById("next").addEventListener("click", () => go(active + 1));
document.getElementById("full").addEventListener("click", () => {
  if(document.fullscreenElement){ document.exitFullscreen(); }
  else { document.documentElement.requestFullscreen(); }
});

addEventListener("keydown", event => {
  if(["ArrowRight","PageDown"," "].includes(event.key)){ event.preventDefault(); go(active + 1); }
  if(["ArrowLeft","PageUp"].includes(event.key)){ event.preventDefault(); go(active - 1); }
  if(event.key.toLowerCase() === "f"){ document.getElementById("full").click(); }
});

render();
</script>
</body>
</html>

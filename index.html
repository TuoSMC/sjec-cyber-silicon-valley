<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cyber Silicon Valley - Atelier Keynote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#101418;
    --carbon:#151a20;
    --surface:#1c232a;
    --surface-2:#222a33;
    --ink:#f3f7f8;
    --body:#ccd5d7;
    --muted:#8d9aa0;
    --hair:#3a454c;
    --gold:#b99a58;
    --gold-soft:#d6c18d;
    --red:#b92c24;
    --blue:#2b8ac5;
    --cyan:#74c7e8;
    --pad-x:clamp(40px,6vw,104px);
    --pad-y:clamp(26px,5vh,64px);
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--black);color:var(--ink);overflow:hidden}
  body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .deck{
    position:relative;
    width:100vw;
    height:100vh;
    background:
      radial-gradient(90% 86% at 78% 18%, rgba(116,199,232,.18), transparent 48%),
      radial-gradient(72% 58% at 4% 92%, rgba(43,138,197,.13), transparent 54%),
      linear-gradient(90deg, rgba(16,20,24,.95) 0%, rgba(16,20,24,.82) 48%, rgba(16,20,24,.55) 100%),
      repeating-linear-gradient(90deg, rgba(116,199,232,.05) 0 1px, transparent 1px 136px),
      var(--black);
    isolation:isolate;
  }

  .deck::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      linear-gradient(180deg, rgba(255,255,255,.08), transparent 13%, transparent 84%, rgba(255,255,255,.05)),
      repeating-linear-gradient(0deg, rgba(116,199,232,.035) 0 1px, transparent 1px 52px),
      repeating-linear-gradient(90deg, rgba(116,199,232,.026) 0 1px, transparent 1px 52px),
      repeating-linear-gradient(135deg, rgba(255,255,255,.014) 0 1px, transparent 1px 22px);
    mix-blend-mode:screen;
    opacity:.36;
  }

  .deck::after{
    content:"";
    position:absolute;
    inset:18px;
    border:1px solid rgba(116,199,232,.16);
    z-index:7;
    pointer-events:none;
  }

  .slide{
    position:absolute;
    inset:0;
    opacity:0;
    pointer-events:none;
    transform:scale(1.014);
    filter:blur(7px);
    transition:opacity .85s cubic-bezier(.16,1,.3,1),transform 1.1s cubic-bezier(.16,1,.3,1),filter .75s ease;
    will-change:opacity,transform,filter;
  }

  .slide.active{opacity:1;pointer-events:auto;transform:none;filter:none;transition-delay:.04s}

  .hero-media{
    position:absolute;
    inset:0 0 0 auto;
    width:58vw;
    overflow:hidden;
    z-index:0;
  }

  .hero-media .image{
    position:absolute;
    inset:-3%;
    background-size:cover;
    background-position:center;
    filter:grayscale(.55) brightness(.5) contrast(1.14) saturate(.66);
    opacity:.58;
    transform:scale(1.05);
    transition:opacity .9s ease;
  }
  .slide.active .hero-media .image{
    opacity:.66;
    animation:kenburns 20s ease-out both;
  }
  @keyframes kenburns{from{transform:scale(1.05)}to{transform:scale(1.13)}}

  /* vivid real-photo slides (DCBBS / server racks) — full colour, stronger scrim so text stays clean */
  .slide.vivid .hero-media .image{
    filter:grayscale(.08) brightness(.82) contrast(1.05) saturate(1.1);
    opacity:.92;
  }
  .slide.vivid .hero-media::before{
    background:
      linear-gradient(90deg, #101418 0%, rgba(16,20,24,.93) 28%, rgba(16,20,24,.52) 62%, rgba(16,20,24,.18) 100%),
      linear-gradient(180deg, rgba(16,20,24,.22), transparent 46%, rgba(16,20,24,.52));
  }

  .hero-media::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:2;
    background:
      linear-gradient(90deg, #101418 0%, rgba(16,20,24,.88) 22%, rgba(16,20,24,.48) 58%, rgba(16,20,24,.2) 100%),
      linear-gradient(180deg, rgba(16,20,24,.24), transparent 44%, rgba(16,20,24,.58));
  }

  .hero-media::after{
    content:"";
    position:absolute;
    right:11vw;
    top:50%;
    width:min(42vw,620px);
    aspect-ratio:1;
    transform:translateY(-50%);
    border:1px solid rgba(116,199,232,.11);
    border-radius:50%;
    background:
      repeating-conic-gradient(from -12deg, rgba(116,199,232,.12) 0deg 1deg, transparent 1deg 14deg),
      radial-gradient(circle, transparent 0 56%, rgba(116,199,232,.11) 56% 57%, transparent 57% 100%);
    opacity:.22;
    mix-blend-mode:screen;
  }

  .content{
    position:absolute;
    z-index:4;
    left:var(--pad-x);
    top:var(--pad-y);
    bottom:var(--pad-y);
    width:min(56vw,930px);
    display:grid;
    grid-template-rows:auto 1fr auto;
  }

  .topline{
    display:flex;
    align-items:center;
    gap:18px;
    color:var(--muted);
    font:500 11px/1 JetBrains Mono,monospace;
    letter-spacing:.22em;
    text-transform:uppercase;
  }

  .topline .mark{
    width:74px;
    height:4px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:4px;
  }

  .topline .mark i:nth-child(1){background:rgba(43,138,197,.92)}
  .topline .mark i:nth-child(2){background:rgba(116,199,232,.8)}
  .topline .mark i:nth-child(3){background:rgba(185,154,88,.68)}

  .main{
    align-self:center;
    max-width:980px;
  }

  .kicker{
    margin:0 0 18px;
    color:#b8d8e6;
    font:500 12px/1.2 JetBrains Mono,monospace;
    letter-spacing:.2em;
    text-transform:uppercase;
  }

  h1{
    margin:0;
    max-width:14ch;
    font-family:Inter,system-ui,sans-serif;
    font-size:clamp(38px,min(5.9vw,9.2vh),82px);
    font-weight:800;
    line-height:.96;
    letter-spacing:.01em;
    text-transform:uppercase;
  }

  h1 .accent{color:#b8d8e6}
  .slide[data-tone="red"] h1 .accent{color:#e2b0ac}
  .slide[data-tone="blue"] h1 .accent{color:#a8c8df}

  p.lede{
    max-width:62ch;
    margin:22px 0 0;
    color:#d4dcde;
    font-size:clamp(16px,1.2vw,21px);
    line-height:1.52;
    font-weight:300;
  }

  .proof{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:0 clamp(22px,2.7vw,44px);
    margin-top:clamp(26px,3vw,42px);
    max-width:1000px;
  }

  .spec{
    border-top:1px solid rgba(116,199,232,.24);
    padding-top:15px;
    min-height:96px;
  }

  .spec .num{
    display:flex;
    align-items:center;
    gap:10px;
    color:#b8d8e6;
    font:600 12px/1 JetBrains Mono,monospace;
    letter-spacing:.18em;
    text-transform:uppercase;
    margin-bottom:14px;
  }

  .spec .num::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, rgba(116,199,232,.32), transparent);
  }

  .spec p{
    margin:0;
    color:#e3e8e8;
    font-size:clamp(13px,1vw,16px);
    line-height:1.55;
    font-weight:300;
  }

  .footer{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:end;
    gap:28px;
    color:var(--muted);
    font:500 11px/1 JetBrains Mono,monospace;
    letter-spacing:.18em;
    text-transform:uppercase;
  }

  .footer .rule{
    height:1px;
    background:linear-gradient(90deg, rgba(116,199,232,.34), rgba(255,255,255,.1), transparent);
    margin-bottom:5px;
  }

  .footer strong{color:var(--ink);font-weight:500}

  .chapter{
    position:absolute;
    z-index:5;
    right:var(--pad-x);
    top:var(--pad-y);
    display:flex;
    align-items:flex-start;
    gap:18px;
    color:rgba(248,245,238,.84);
    font:500 11px/1 JetBrains Mono,monospace;
    letter-spacing:.22em;
    text-transform:uppercase;
  }

  .chapter .number{
    color:rgba(184,216,230,.84);
    font-family:Inter,system-ui,sans-serif;
    font-size:clamp(38px,4.8vw,74px);
    font-weight:700;
    line-height:.82;
    letter-spacing:0;
  }

  .side-rail{
    position:absolute;
    z-index:6;
    right:22px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:11px;
  }

  .dot{
    width:7px;
    height:7px;
    border:1px solid rgba(116,199,232,.34);
    background:transparent;
    transform:rotate(45deg);
    cursor:pointer;
  }

  .dot.on{background:#b8d8e6}
  .dot.opt{opacity:.45;background:transparent;border:1px solid rgba(185,154,88,.65)}
  .optbadge{position:absolute;top:5.2vh;left:50%;transform:translateX(-50%);z-index:5;font:600 9px/1 'JetBrains Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:#bfa569;border:1px solid rgba(185,154,88,.45);background:rgba(185,154,88,.07);padding:5px 11px;border-radius:3px}

  .progress{
    position:fixed;
    left:18px;
    right:18px;
    bottom:18px;
    z-index:8;
    height:2px;
    background:rgba(255,255,255,.08);
  }

  .progress i{
    display:block;
    height:100%;
    width:0;
    background:linear-gradient(90deg, rgba(43,138,197,.86), rgba(116,199,232,.92));
    transition:width .72s cubic-bezier(.22,.61,.36,1);
  }

  .controls{
    position:fixed;
    z-index:9;
    right:var(--pad-x);
    bottom:calc(var(--pad-y) - 18px);
    display:flex;
    gap:10px;
  }

  .controls button{
    width:42px;
    height:42px;
    border:1px solid rgba(116,199,232,.28);
    border-radius:0;
    color:var(--ink);
    background:rgba(12,12,12,.68);
    font:600 15px/1 JetBrains Mono,monospace;
    cursor:pointer;
    backdrop-filter:blur(14px);
  }

  .controls button:hover{border-color:var(--cyan);color:var(--cyan)}

  body.exporting .controls,
  body.exporting .side-rail{
    display:none;
  }

  /* ---- techy transition: scan sweep + frame corner ticks ---- */
  .sweep{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden;opacity:0}
  .sweep.run{animation:sweepFade .72s ease}
  .sweep i{position:absolute;top:0;bottom:0;left:-6%;width:2px;
    background:linear-gradient(180deg,transparent,var(--cyan) 18%,#eaf7ff 50%,var(--cyan) 82%,transparent);
    box-shadow:0 0 30px 6px rgba(116,199,232,.5)}
  .sweep i::before{content:"";position:absolute;top:0;bottom:0;right:2px;width:280px;
    background:linear-gradient(90deg,transparent,rgba(116,199,232,.09))}
  .sweep.run i{animation:sweepMove .72s cubic-bezier(.55,0,.25,1)}
  .sweep.run.rev i{animation:sweepMoveRev .72s cubic-bezier(.55,0,.25,1)}
  .sweep.run.rev i::before{right:auto;left:2px;background:linear-gradient(270deg,transparent,rgba(116,199,232,.09))}
  @keyframes sweepMove{from{left:-6%}to{left:106%}}
  @keyframes sweepMoveRev{from{left:106%}to{left:-6%}}
  @keyframes sweepFade{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

  .corners{position:fixed;inset:18px;z-index:8;pointer-events:none}
  .corners span{position:absolute;width:13px;height:13px;border:1px solid rgba(116,199,232,.5)}
  .corners span:nth-child(1){top:-1px;left:-1px;border-right:0;border-bottom:0}
  .corners span:nth-child(2){top:-1px;right:-1px;border-left:0;border-bottom:0}
  .corners span:nth-child(3){bottom:-1px;left:-1px;border-right:0;border-top:0}
  .corners span:nth-child(4){bottom:-1px;right:-1px;border-left:0;border-top:0}

  /* faint diagonal ownership watermark — subtle on screen, visible on copies/screenshots, tiles full-frame so it can't be cropped out */
  .watermark{position:fixed;top:-30%;left:-30%;width:160%;height:160%;z-index:7;pointer-events:none;
    opacity:.018;transform:rotate(-30deg);background-repeat:repeat;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="360" height="188"><text x="8" y="100" font-family="monospace" font-size="14" letter-spacing="5" fill="%23ffffff">SUPERMICRO / TUO / SJEC EXPO 2026</text></svg>');}

  .slide.active .reveal{animation:reveal .78s both cubic-bezier(.22,.61,.36,1)}
  .slide.active .reveal:nth-child(1){animation-delay:.04s}
  .slide.active .reveal:nth-child(2){animation-delay:.12s}
  .slide.active .reveal:nth-child(3){animation-delay:.20s}
  .slide.active .spec{animation:reveal .72s both cubic-bezier(.22,.61,.36,1)}
  .slide.active .spec:nth-child(1){animation-delay:.28s}
  .slide.active .spec:nth-child(2){animation-delay:.38s}
  .slide.active .spec:nth-child(3){animation-delay:.48s}

  @keyframes reveal{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:none}
  }

  /* alternate layout: "wall" (problem grid) - same style, different composition */
  .slide.wall .hero-media,.slide.stat .hero-media,.slide.loop .hero-media,.slide.agents .hero-media,.slide.react .hero-media,.slide.stack .hero-media,.slide.split .hero-media,.slide.lede .hero-media,.slide.twocol .hero-media,.slide.pillars .hero-media,.slide.timeline .hero-media,.slide.ladder .hero-media,.slide.barrier .hero-media,.slide.fuse .hero-media,.slide.growth .hero-media,.slide.iso .hero-media,.slide.evolve .hero-media{display:none}
  .slide.wall .content,.slide.stat .content,.slide.loop .content,.slide.agents .content,.slide.react .content,.slide.stack .content,.slide.split .content,.slide.lede .content,.slide.twocol .content,.slide.pillars .content,.slide.timeline .content,.slide.ladder .content,.slide.barrier .content,.slide.fuse .content,.slide.growth .content,.slide.iso .content,.slide.evolve .content{width:auto;right:var(--pad-x)}
  .wallmain{align-self:center;width:100%}
  .wallhead{margin:0 0 6px;font-family:Inter,system-ui,sans-serif;font-weight:800;text-transform:uppercase;
    line-height:.96;letter-spacing:.01em;font-size:clamp(34px,min(5.4vw,8vh),68px);max-width:20ch}
  .bricks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:24px 0 16px}
  .brick{border:1px solid rgba(116,199,232,.22);background:rgba(116,199,232,.045);
    padding:15px 16px 17px;display:flex;flex-direction:column;gap:7px;min-height:104px}
  .brick .bk{font:600 11px/1 JetBrains Mono,monospace;letter-spacing:.18em;text-transform:uppercase;color:#b8d8e6}
  .brick .bv{font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(17px,1.5vw,24px);color:#f3f7f8;line-height:1.05}
  .brick .bd{font-size:12px;line-height:1.42;color:#9aa0a6;font-weight:300}
  .wallclose{margin:0;font-family:Inter,system-ui,sans-serif;font-weight:300;font-size:clamp(15px,1.3vw,20px);color:#d4dcde;max-width:66ch}
  .haspic .wallmain{width:64%}
  .haspic .wallclose{max-width:48ch}
  .rackpic{position:absolute;right:calc(var(--pad-x) - 10px);top:9%;bottom:9%;width:27%;background-position:center;background-repeat:no-repeat;background-size:contain;background-color:rgb(8,11,15);border:1px solid rgba(116,199,232,.18);border-radius:4px;filter:drop-shadow(0 0 26px rgba(116,199,232,.16));pointer-events:none}
  .slide.active .brick{animation:reveal .7s both cubic-bezier(.22,.61,.36,1)}
  .slide.active .brick:nth-child(1){animation-delay:.16s}
  .slide.active .brick:nth-child(2){animation-delay:.22s}
  .slide.active .brick:nth-child(3){animation-delay:.28s}
  .slide.active .brick:nth-child(4){animation-delay:.34s}
  .slide.active .brick:nth-child(5){animation-delay:.40s}
  .slide.active .brick:nth-child(6){animation-delay:.46s}
  .slide.active .brick:nth-child(7){animation-delay:.52s}

  /* stat layout */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:30px 0 16px}
  .stats .stat{border-left:2px solid rgba(116,199,232,.5);padding:2px 0 2px 18px}
  .stats .stat .sv{font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(34px,4.2vw,62px);line-height:1;color:#f3f7f8}
  .stats .stat .sk{margin-top:10px;font:600 11px/1.3 JetBrains Mono,monospace;letter-spacing:.16em;text-transform:uppercase;color:#b8d8e6}
  .wallsub{margin:8px 0 0;font:500 13px/1.5 JetBrains Mono,monospace;letter-spacing:.03em;color:#9aa0a6}

  /* loop layout */
  .loop{display:flex;align-items:stretch;gap:8px;margin:26px 0 16px;flex-wrap:wrap}
  .loop .step{flex:1 1 0;min-width:165px;border:1px solid rgba(116,199,232,.22);background:rgba(116,199,232,.045);padding:14px 15px 16px;display:flex;flex-direction:column;gap:7px}
  .loop .sn{font:700 12px/1 JetBrains Mono,monospace;color:#b8d8e6;letter-spacing:.1em}
  .loop .sk{font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(15px,1.3vw,21px);text-transform:uppercase;color:#f3f7f8;line-height:1.05}
  .loop .step .bd{font-size:12px;line-height:1.42;color:#9aa0a6;font-weight:300}
  .loop .arrow{display:flex;align-items:center;color:#b8d8e6;font-size:18px;opacity:.6}

  /* agents layout */
  .super{margin:24px 0 12px;border:1px solid rgba(116,199,232,.3);background:rgba(116,199,232,.06);padding:13px 16px;font:600 13px/1.4 JetBrains Mono,monospace;letter-spacing:.05em;text-transform:uppercase;color:#d6eaf2}
  .agentrow{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .agentrow .brick{min-height:78px}

  /* react engineering diagram */
  .react .diagram{display:flex;justify-content:center}
  .react svg{display:block;width:100%;height:auto;max-height:49vh;margin:10px 0 0}
  .rnode{fill:rgba(116,199,232,.06);stroke:rgba(116,199,232,.5);stroke-width:1.3}
  .rnode-l{font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:18px;fill:#f3f7f8;letter-spacing:.04em}
  .rnode-d{font-family:'JetBrains Mono',monospace;font-size:10.5px;fill:#9aa0a6}
  .rlink{fill:none;stroke:rgba(116,199,232,.4);stroke-width:1.3}
  .rflow{fill:none;stroke:#9fe0ff;stroke-width:2.4;stroke-dasharray:2 12;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(116,199,232,.9));animation:flow .7s linear infinite}
  .rfeedback{fill:none;stroke:#e6cf95;stroke-width:2;stroke-dasharray:2 12;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(185,154,88,.7));animation:flow 1.5s linear infinite}
  .rlabel{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:10px;fill:#b8d8e6;letter-spacing:.1em}
  .rlabel.rgold{fill:#d6c18d}
  .rgate{fill:rgba(185,154,88,.12);stroke:rgba(185,154,88,.7);stroke-width:1.3}
  .rgate-l{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;fill:#d6c18d;letter-spacing:.08em}
  .rchip{fill:rgba(116,199,232,.05);stroke:rgba(116,199,232,.32);stroke-width:1}
  .rchip-l{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:9px;fill:#b8d8e6;letter-spacing:.05em}
  @keyframes flow{to{stroke-dashoffset:-28}}

  /* stack (3D layered) diagram */
  .stack svg{display:block;width:100%;height:auto;max-height:53vh;margin:6px 0 0}
  .plate{stroke-width:1.5;filter:drop-shadow(0 7px 12px rgba(0,0,0,.6))}
  .plate-c{fill:rgba(18,26,34,.92);stroke:rgba(116,199,232,.6)}
  .plate-g{fill:rgba(46,37,18,.95);stroke:rgba(185,154,88,.9)}
  .plate-side{stroke-width:1}
  .plate-side-l{fill:rgba(7,12,17,.97);stroke:rgba(116,199,232,.22)}
  .plate-side-r{fill:rgba(12,19,26,.97);stroke:rgba(116,199,232,.32)}
  .pl-l{font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:21px;fill:#f3f7f8;letter-spacing:.05em}
  .pl-l.g{fill:#e6cf95}
  .pl-d{font-family:'JetBrains Mono',monospace;font-size:11px;fill:#9aa0a6}
  .mod{fill:rgba(13,20,27,.96);stroke:rgba(116,199,232,.55);stroke-width:1.4}
  .mod-g{fill:rgba(38,31,16,.96);stroke:rgba(185,154,88,.85)}
  .modroof{fill:rgba(116,199,232,.14);stroke:rgba(116,199,232,.5);stroke-width:1}
  .modlabel{fill:rgba(116,199,232,.1)}
  .mod-l{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12.5px;fill:#dff0f8;letter-spacing:.06em}
  .mod-l.g{fill:#e6cf95}
  .seam{stroke:rgba(116,199,232,.28);stroke-width:1;fill:none}
  .bolt{fill:rgba(116,199,232,.55)}

    let agents='';A.forEach((a,i)=>{const ay=TY+6+i*37;agents+=`<rect class="mini" x="2" y="${ay}" width="62" height="30" rx="2"/><text class="mini-l" x="33" y="${ay+19}" text-anchor="middle">${esc(a.k)}</text><line class="rlink" x1="64" y1="${ay+15}" x2="${TX[0]}" y2="${ay+15}" stroke-width="2"/><line class="rflow" x1="64" y1="${ay+15}" x2="${TX[0]}" y2="${ay+15}"/>`;});
    const cx0=TX[0]+TW/2,cx4=TX[4]+TW/2;
    const feedback=`<path class="rfeedback" d="M${cx4},134 C ${cx4},48 ${cx0},48 ${cx0},134" marker-end="url(#ahg2)"/><text class="rlabel rgold" x="${(cx0+cx4)/2}" y="40" text-anchor="middle">RE-RUN THE LOOP</text>`;
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="diagram reveal"><svg viewBox="0 0 1130 380" preserveAspectRatio="xMidYMid meet"><defs><marker id="ahg2" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e6cf95"/></marker></defs>${bridges}${feedback}${towers}${agents}</svg></div><p class="wallclose reveal">${esc(slide.floor)}</p></div>`;
  }
  if(slide.layout === "stat"){
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="stats reveal">${slide.stats.map(s=>`<div class="stat"><div class="sv">${esc(s.v)}</div><div class="sk">${esc(s.k)}</div></div>`).join("")}</div><p class="wallclose reveal">${esc(slide.weld)}</p><p class="wallsub reveal">${esc(slide.scale2)}</p></div>${slide.rackimg?`<div class="rackpic" style="background-image:url('${esc(slide.rackimg)}')"></div>`:""}`;
  }
  if(slide.layout === "loop"){
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="loop reveal">${slide.loop.map((s,i)=>`<div class="step"><div class="sn">${esc(s.n)}</div><div class="sk">${esc(s.k)}</div><div class="bd">${esc(s.d)}</div></div>${i<slide.loop.length-1?`<div class="arrow">&rarr;</div>`:""}`).join("")}</div><p class="wallclose reveal">${esc(slide.callout)}</p></div>`;
  }
  if(slide.layout === "agents"){
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="super reveal">${esc(slide.supervisor)}</div><div class="bricks agentrow reveal">${slide.agents.map(a=>`<div class="brick"><div class="bk">${esc(a.k)}</div><div class="bd">${esc(a.d)}</div></div>`).join("")}</div><p class="wallclose reveal">${esc(slide.floor)}</p></div>`;
  }
  if(slide.layout === "split"){
    return `<div class="main wallmain splitwrap"><div class="splitL"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="splitpts">${slide.points.map((p,i)=>`<div class="spitem reveal"><span class="spn">${String(i+1).padStart(2,"0")}</span><p>${esc(p)}</p></div>`).join("")}</div><p class="wallclose reveal">${esc(slide.lede)}</p></div><figure class="splitR reveal"><span class="splitfr"></span><div class="splitimg" style="background-image:url('${esc(slide.sideimg)}')"></div></figure></div>`;
  }
  if(slide.layout === "lede"){
    return `<div class="main wallmain ledewrap"><p class="kicker reveal">${esc(slide.eyebrow)}</p><h1 class="ledehead reveal">${titleHtml(slide)}</h1><p class="ledebig reveal">${esc(slide.lede)}</p><div class="ledepts reveal">${slide.points.map((p,i)=>`<div class="ledept"><span>${String(i+1).padStart(2,"0")}</span><p>${esc(p)}</p></div>`).join("")}</div></div>`;
  }
  if(slide.layout === "twocol"){
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="twocol reveal">${slide.points.map((p,i)=>`<div class="tcitem"><span class="tcn">${String(i+1).padStart(2,"0")}</span><p>${esc(p)}</p></div>`).join("")}</div><p class="wallclose reveal">${esc(slide.lede)}</p></div>`;
  }
  if(slide.layout === "pillars"){
    const items = slide.wall || slide.points.map(p=>{const i=p.indexOf(" ");return {k:p.slice(0,i),d:p.slice(i+1)};});
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="pillars reveal">${items.map(w=>`<div class="pillar"><div class="pcap">${esc(w.k)}</div>${w.v?`<div class="pval">${esc(w.v)}</div>`:""}<div class="pbar"></div><div class="pdesc">${esc(w.d)}</div></div>`).join("")}</div><p class="wallclose reveal">${esc(slide.close||slide.lede)}</p></div>${slide.rackimg?`<div class="rackpic" style="background-image:url('${esc(slide.rackimg)}')"></div>`:""}`;
  }
  if(slide.layout === "timeline"){
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="tline reveal"><span class="tline-rail"></span>${slide.wall.map(w=>`<div class="tnode"><span class="tdot"></span><div class="tk">${esc(w.k)}</div><div class="tv">${esc(w.v)}</div><div class="td">${esc(w.d)}</div></div>`).join("")}</div><p class="wallclose reveal">${esc(slide.close)}</p></div>`;
  }
  if(slide.layout === "ladder"){
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="ladder reveal">${slide.wall.map((w,i)=>`<div class="rung" style="--lvl:${i}"><span class="rn">${String(i+1).padStart(2,"0")}</span><div class="rbody"><div class="rk">${esc(w.k)}</div><div class="rd"><b>${esc(w.v)}</b> ${esc(w.d)}</div></div></div>`).join("")}</div><p class="wallclose reveal">${esc(slide.close)}</p></div>`;
  }
  if(slide.layout === "barrier"){
    const items = slide.wall;
    const bw=224, bh=74, gx=12, gy=8, x0=316, y0=92;
    let bricks='';
    items.forEach((it,i)=>{
      const r=Math.floor(i/2), c=i%2;
      const lone=(i===items.length-1 && items.length%2===1);
      const x=lone ? x0+(bw+gx)/2 : x0 + c*(bw+gx);
      const y=y0 + r*(bh+gy);
      bricks += `<rect class="bbrick" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="2"/><rect class="bbrickcap" x="${x}" y="${y}" width="${bw}" height="6"/><text class="bk2" x="${x+16}" y="${y+32}">${esc(it.k)}</text><text class="bv2" x="${x+16}" y="${y+57}">${esc(it.v)}</text>`;
    });
    let slots='';for(let s=0;s<5;s++){slots+=`<rect class="rackslot" x="38" y="${170+s*30}" width="90" height="20" rx="1.5"/>`;}
    let city='';const ch=[64,104,150,86,124,58];let cx=866;ch.forEach(h=>{city+=`<rect class="bcity" x="${cx}" y="${382-h}" width="30" height="${h}"/>`;cx+=38;});
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="diagram reveal"><svg viewBox="0 0 1120 470" preserveAspectRatio="xMidYMid meet"><defs><marker id="ahok" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#74d6a0"/></marker><marker id="ahdim" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="rgba(116,199,232,.5)"/></marker></defs><rect class="rackbox" x="28" y="152" width="108" height="170" rx="4"/>${slots}<text class="blabel" x="82" y="140" text-anchor="middle">THE RACK</text><text class="blabel ok" x="82" y="342" text-anchor="middle">EASY PART &#10003;</text><line class="blink" x1="140" y1="236" x2="300" y2="236"/><line class="bflow-ok" x1="140" y1="236" x2="296" y2="236" marker-end="url(#ahok)"/><path class="bblock" d="M302,212 L316,236 L302,260"/><path class="bblock" d="M292,220 L306,236 L292,252"/><text class="blabel bad" x="546" y="78" text-anchor="middle">THE WALL &#8212; WHERE DEPLOYMENTS DIE</text>${bricks}<line class="bflow-dim" x1="782" y1="236" x2="858" y2="236" marker-end="url(#ahdim)"/>${city}<text class="blabel" x="950" y="402" text-anchor="middle" opacity=".62">LIVE DEPLOYMENT</text></svg></div><p class="wallclose reveal">${esc(slide.close)}</p></div>`;
  }
  if(slide.layout === "fuse"){
    const col=(title,items,gold)=>`<div class="fcol${gold?' f-gold':''}"><div class="fhd">${esc(title)}</div>${items.map(it=>`<div class="fitem"><div class="fk">${esc(it.k)}</div><div class="fd">${esc(it.d)}</div></div>`).join("")}</div>`;
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="fuse reveal">${col(slide.fromTitle,slide.from,false)}<div class="farrow"><svg viewBox="0 0 44 60" width="44" height="60"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#e6cf95"/></marker></defs><line class="ffl" x1="3" y1="30" x2="38" y2="30" marker-end="url(#fah)"/></svg><span class="fa-l">DRIVES</span></div>${col(slide.toTitle,slide.to,true)}</div><p class="wallclose reveal">${esc(slide.close)}</p></div>${slide.rackimg?`<div class="rackpic" style="background-image:url('${esc(slide.rackimg)}')"></div>`:""}`;
  }
  if(slide.layout === "growth"){
    const items=slide.wall;
    const vals=items.map(w=>Math.max(...(w.v.match(/\d+/g)||[1]).map(Number)));
    const maxV=Math.max(...vals);
    const base=398,maxH=300,minH=22,step=1080/items.length,bw=138;
    let bars='',pts=[];
    items.forEach((w,i)=>{
      const h=minH+(vals[i]/maxV)*(maxH-minH);
      const cx=Math.round(30+step*i+step/2), x=cx-bw/2, y=Math.round(base-h), g=(i===items.length-1);
      pts.push([cx,y]);
      bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.round(h)}" rx="3" fill="url(#${g?'gbg':'gb'})" stroke="${g?'rgba(185,154,88,.85)':'rgba(116,199,232,.5)'}" stroke-width="1.2"/><text class="gval${g?' g':''}" x="${cx}" y="${y-15}" text-anchor="middle">${esc(w.v.replace(/\s*\/.*/,''))}</text><text class="gk" x="${cx}" y="${base+24}" text-anchor="middle">${esc(w.k)}</text><text class="gd" x="${cx}" y="${base+42}" text-anchor="middle">${esc(w.d)}</text>`;
    });
    let curve=pts.length?`M${pts[0][0]},${pts[0][1]}`:"";
    for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||pts[i+1];const c1x=(p1[0]+(p2[0]-p0[0])/6).toFixed(1),c1y=(p1[1]+(p2[1]-p0[1])/6).toFixed(1),c2x=(p2[0]-(p3[0]-p1[0])/6).toFixed(1),c2y=(p2[1]-(p3[1]-p1[1])/6).toFixed(1);curve+=` C${c1x},${c1y} ${c2x},${c2y} ${p2[0]},${p2[1]}`;}
    const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#0c1318" stroke="${i===pts.length-1?'#e6cf95':'#74c7e8'}" stroke-width="2"/>`).join('');
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="diagram reveal"><svg viewBox="0 0 1120 470" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="gb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2b8ac5" stop-opacity=".05"/><stop offset="1" stop-color="#74c7e8" stop-opacity=".34"/></linearGradient><linearGradient id="gbg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b9985a" stop-opacity=".06"/><stop offset="1" stop-color="#e6cf95" stop-opacity=".42"/></linearGradient></defs><line class="gbase" x1="24" y1="${base+2}" x2="1096" y2="${base+2}"/>${bars}<path class="gtrend" d="${curve}"/>${dots}</svg></div><p class="wallclose reveal">${esc(slide.close)}</p></div>`;
  }
  if(slide.layout === "iso"){
    const parse=v=>{const n=(v.match(/[\d.]+/g)||[1]).map(Number);let m=Math.max(...n);if(/MW/i.test(v))m*=1000;return m;};
    const items=slide.wall.map(w=>({k:w.k,v:w.v,d:w.d,val:parse(w.v)})).sort((a,b)=>a.val-b.val);
    const maxV=Math.max(...items.map(i=>i.val));
    const base=390,maxH=292,minH=34,step=1080/items.length,w=102,D=19,DY=-11;
    const pal={front:"rgba(46,103,131,.5)",top:"rgba(116,199,232,.46)",side:"rgba(14,32,44,.66)",st:"rgba(116,199,232,.55)"};
    const palg={front:"rgba(120,96,44,.52)",top:"rgba(230,207,149,.5)",side:"rgba(44,34,14,.66)",st:"rgba(185,154,88,.85)"};
    let shadows='',svg='',tops=[];
    items.forEach((it,i)=>{
      const hh=Math.round(minH+Math.pow(it.val/maxV,0.7)*(maxH-minH));
      const cx=Math.round(30+step*i+step/2), bx=cx-w/2, by=base, g=(i===items.length-1), p=g?palg:pal;
      tops.push([cx,by-hh]);
      shadows+=`<ellipse cx="${cx+D/2+7}" cy="${base+8}" rx="${Math.round(w*0.66)}" ry="11" fill="rgba(0,0,0,.82)" filter="url(#isosh)"/>`;
      const tl=[bx,by-hh],tr=[bx+w,by-hh],br=[bx+w,by],bl=[bx,by],ttl=[bx+D,by-hh+DY],ttr=[bx+w+D,by-hh+DY],tbr=[bx+w+D,by+DY];
      svg+=`<polygon points="${tl} ${tr} ${ttr} ${ttl}" fill="${p.top}" stroke="${p.st}" stroke-width="1"/><polygon points="${tr} ${br} ${tbr} ${ttr}" fill="${p.side}" stroke="${p.st}" stroke-width="1"/><polygon points="${bl} ${br} ${tr} ${tl}" fill="${p.front}" stroke="${p.st}" stroke-width="1.1"/>`;
      svg+=`<text class="ival${g?' g':''}" x="${cx+D/2}" y="${by-hh+DY-9}" text-anchor="middle">${esc(it.v.replace(/up to /i,'').replace(/\s*\/.*/,''))}</text>`;
      svg+=`<text class="ik" x="${cx}" y="${base+24}" text-anchor="middle">${esc(it.k)}</text><text class="idd" x="${cx}" y="${base+41}" text-anchor="middle">${esc(it.d)}</text>`;
    });
    let leap='';
    if(items.length>=2){
      const a=tops[items.length-2], b=tops[items.length-1];
      const ratio=Math.round(items[items.length-1].val/items[items.length-2].val);
      leap=`<path class="ileap" d="M${a[0]+46},${a[1]-6} Q ${(a[0]+b[0])/2+22},${b[1]+24} ${b[0]-52},${b[1]+34}" marker-end="url(#ileapah)"/><text class="ileap-l" x="${(a[0]+b[0])/2-16}" y="${(a[1]+b[1])/2-2}" text-anchor="middle">&#8776; ${ratio}&#215; LEAP</text>`;
    }
    return `<div class="main wallmain"><h1 class="wallhead reveal">${titleHtml(slide)}</h1><div class="diagram reveal"><svg viewBox="0 0 1120 470" preserveAspectRatio="xMidYMid meet"><defs><filter id="isosh" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter><marker id="ileapah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e6cf95"/></marker></defs><line class="gbase" x1="20" y1="${base+1}" x2="1100" y2="${base+1}"/>${shadows}${svg}${leap}</svg></div><p class="wallclose reveal">${esc(slide.close)}</p></div>`;
  }
  return `<div class="main"><p class="kicker reveal">${esc(slide.eyebrow)}</p><h1 class="reveal">${titleHtml(slide)}</h1><p class="lede reveal">${esc(slide.lede)}</p><div class="proof">${slide.points.map((point,pointIdx)=>`<div class="spec"><span class="num">${String(pointIdx+1).padStart(2,"0")}</span><p>${esc(point)}</p></div>`).join("")}</div></div>`;
}

function render(){
  deck.innerHTML = slides.map((slide, idx) => `
    <section class="slide ${idx === 0 ? "active" : ""} ${slide.photo ? "vivid" : ""}${slide.layout ? " " + esc(slide.layout) : ""}${slide.rackimg ? " haspic" : ""}${slide.video ? " hasvideo" : ""}" data-tone="${esc(slide.tone)}">
      <div class="hero-media"><div class="image" style="background-image:url('${esc(slide.photo || slide.image)}')"></div></div>
      ${slide.video ? `<video class="herovid" autoplay muted loop playsinline preload="auto" src="${esc(slide.video)}"></video><div class="vidscrim"></div>` : ""}
      <div class="chapter"><span>${esc(slide.eyebrow.split("/")[0].trim())}</span><span class="number">${String(idx + 1).padStart(2,"0")}</span></div>
      ${slide.optional?`<div class="optbadge">Optional · skip if time</div>`:""}
      <div class="content">
        <div class="topline reveal"><span class="mark"><i></i><i></i><i></i></span><span>${esc(slide.tagline)}</span></div>
        ${mainBlock(slide)}
        <div class="footer">
          <div><div class="rule"></div><span>Supermicro / SJEC Expo / Cyber Silicon Valley</span></div>
          <span><strong>${String(idx + 1).padStart(2,"0")}</strong> / ${String(slides.length).padStart(2,"0")}</span>
        </div>
      </div>
    </section>
  `).join("");

  rail.innerHTML = slides.map((s, idx) => `<button class="dot ${idx === 0 ? "on" : ""}${s.optional?" opt":""}" data-slide="${idx}" title="Slide ${idx + 1}" aria-label="Go to slide ${idx + 1}"></button>`).join("");
  rail.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => go(Number(btn.dataset.slide))));
  deck.querySelectorAll("video.herovid").forEach(v => { v.muted = true; const p = v.play(); if(p && p.catch) p.catch(()=>{}); });
  const params = new URLSearchParams(location.search);
  const requested = Number(params.get("slide") || "1");
  if(params.get("export") === "1"){
    document.body.classList.add("exporting");
  }
  go(Number.isFinite(requested) ? requested - 1 : 0);
}

const sweep = document.getElementById("sweep");
function runSweep(dir){
  if(!sweep) return;
  sweep.classList.remove("run","rev");
  void sweep.offsetWidth;            // restart the animation
  sweep.classList.add("run");
  if(dir < 0) sweep.classList.add("rev");
}

function go(next){
  const target = Math.max(0, Math.min(slides.length - 1, next));
  if(target !== active) runSweep(target > active ? 1 : -1);
  active = target;
  document.querySelectorAll(".slide").forEach((slide, idx) => slide.classList.toggle("active", idx === active));
  document.querySelectorAll(".dot").forEach((dot, idx) => dot.classList.toggle("on", idx === active));
  progress.style.width = `${((active + 1) / slides.length) * 100}%`;
}

document.getElementById("prev").addEventListener("click", () => go(active - 1));
document.getElementById("next").addEventListener("click", () => go(active + 1));
document.getElementById("full").addEventListener("click", () => {
  if(document.fullscreenElement){ document.exitFullscreen(); }
  else { document.documentElement.requestFullscreen(); }
});

addEventListener("keydown", event => {
  if(["ArrowRight","PageDown"," "].includes(event.key)){ event.preventDefault(); go(active + 1); }
  if(["ArrowLeft","PageUp"].includes(event.key)){ event.preventDefault(); go(active - 1); }
  if(event.key.toLowerCase() === "f"){ document.getElementById("full").click(); }
});

render();
</script>
